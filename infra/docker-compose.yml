name: livestream

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livestream}
      POSTGRES_USER: ${POSTGRES_USER:-livestream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livestream}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ../recordings:/recordings
    ports:
      - "8889:8889"       # WebRTC (WHIP 송출 / WHEP 시청) HTTP
      - "8189:8189/udp"   # WebRTC 미디어 (ICE)
      - "8888:8888"       # HLS
      - "9997:9997"       # 제어 API (백엔드 전용, 외부 공개 금지)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
